name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The suite is stdlib-only (SSH is faked), so a stock Python image is enough.
      - name: Unit tests
        run: docker run --rm -v "$PWD:/repo" -w /repo python:3.12-slim python -m unittest discover -s tests -v

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build gateway and demo device images
        run: docker compose build
